[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wind-cluster-forced-evolution"
version = "0.1.0"
description = "State-conditioned cross-scale weather forcing for wind-cluster forecasting"
requires-python = ">=3.10"
dependencies = [
  "h5py>=3.9,<4.0",
  "numpy>=1.24,<3.0",
  "PyYAML>=6.0,<7.0",
  "torch>=2.1,<3.0",
  "tqdm>=4.66,<5.0",
]

[project.optional-dependencies]
test = ["pytest>=7.4,<9.0"]
mamba = ["mamba-ssm==2.2.6.post3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
