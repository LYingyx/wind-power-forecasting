seed: 42

data:
  source_h5: /storage/liying/new_try/wind_cluster_forced_evolution/data/jilin_56farm_pad8.h5
  cache_dir: /storage/liying/new_try/wind_cluster_forced_evolution/data/local_bilinear_56farm_v1
  preload_weather: mmap
  preload_weather_max_gib: 16.0

model:
  architecture: local_to_global
  weather_channels: 14
  weather_hidden_channels: 48
  d_model: 64
  history_visible_steps: 12
  state_visible_steps: 4
  history_tcn_layers: 3
  trajectory_tcn_layers: 3
  attention_heads: 4
  dropout: 0.05
  state_mode: none
  state_interaction_operator: none
  station_specific_mode: none
  station_embedding_dim: 16
  modulation_amplitude: 0.25
  backbone_lr_multiplier: 1.0

training:
  precision: bf16
  num_workers: 0
  cycles_per_batch: 12
  gradient_clip: 1.0
  early_stopping_patience: 10
  deterministic:
    epochs: 80
    learning_rate: 0.0002
    weight_decay: 0.0001
    station_loss_weight: 1.0
    cluster_loss_weight: 2.0
    auxiliary_weather_loss_weight: 0.0
    baseline_auxiliary_loss_weight: 0.0
    baseline_anchor_loss_weight: 0.0
    anchor_schedule_mode: scalar
    distillation_weight: 0.0
    ema_decay: 0.0
    checkpoint_average_window: 0
    ramp_loss_weight: 0.0

experiment:
  id: local_to_global_raw_bilinear_v1
