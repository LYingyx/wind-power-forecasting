seed: 42

data:
  source_h5: ../data/jilin_56farm_pad8.h5
  cache_dir: ../data/model_cache_pad5_f8
  region_padding_grid_points: 5
  history_power_steps: 24
  forecast_power_steps: 24
  history_nwp_nodes: 6
  future_nwp_nodes: 8
  weather_storage_dtype: float32
  cache_chunk_cycles: 32
  preload_weather: auto
  preload_weather_max_gib: 16.0

model:
  architecture: controlled_transition
  weather_channels: 14
  weather_hidden_channels: 48
  d_model: 64
  station_query_mode: learned_cells
  station_neighborhood_cells: 3
  include_wind_geometry: true
  include_region_context: false
  regional_pool_size: 2
  regional_neighborhood_cells: 1
  forcing_path_mode: difference
  time_query_mode: full_attention
  fusion_mode: state_conditioned
  transition_type: gru
  multirate_enabled: false
  output_level: hierarchical
  history_tcn_layers: 3
  trajectory_tcn_layers: 3
  attention_heads: 4
  dropout: 0.1

training:
  precision: bf16
  num_workers: 0
  cycles_per_batch: 12
  gradient_clip: 1.0
  early_stopping_patience: 12
  checkpoint_metric: cluster_mae_mw

  spatial_pretrain:
    epochs: 40
    batch_size_cycles: 24
    learning_rate: 0.0003
    weight_decay: 0.0001
    station_loss_weight: 1.0
    cluster_loss_weight: 2.0

  deterministic:
    epochs: 80
    learning_rate: 0.0002
    weight_decay: 0.0001
    station_loss_weight: 1.0
    cluster_loss_weight: 2.0
    auxiliary_weather_loss_weight: 0.2
    ramp_loss_weight: 0.0
    multirate_target_loss_weight: 0.0
    multirate_consistency_loss_weight: 0.0
